[package]
name = "persistence"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-native-tls", "macros"] }
tokio = { version = "1.38", features = ["full"] }
sim-core = { path = "../sim-core" }
shared-protocol = { path = "../shared-protocol" }
